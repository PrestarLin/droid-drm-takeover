name: build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libdrm-dev libwayland-dev libudev-dev
      - name: Build
        run: make -j"$(nproc)"
      - name: Smoke
        run: |
          bin/masterprobe /dev/null 2>/dev/null || true
          bin/informats --help 2>/dev/null || true
          file bin/kwinwrap bin/touchtest bin/atomicspy.so
      - uses: actions/upload-artifact@v4
        with:
          name: tools-x86_64
          path: |
            bin/
            !bin/*.c

  cross-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu pkg-config
          sudo dpkg --add-architecture arm64
          # arm64 库来自 ports 源（Ubuntu 对非 amd64 的官方镜像）
          echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main' \
            | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y libdrm-dev:arm64 libwayland-dev:arm64 libudev-dev:arm64
      - name: Cross build
        run: |
          make -j"$(nproc)" CC=aarch64-linux-gnu-gcc \
            PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          file bin/kwinwrap
      - uses: actions/upload-artifact@v4
        with:
          name: tools-aarch64
          path: bin/
